name: Atualizar Produtos

on:
  schedule:
    - cron: '0 * * * *'   # roda toda hora automaticamente
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Buscar produtos do Google Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse

          API_KEY   = os.environ['GOOGLE_API_KEY']
          FOLDER_ID = '1PysZOkqsBUF3V2jvCOO-_9gXEIEhEpxV'

          query = f"'{FOLDER_ID}' in parents and trashed = false"
          params = urllib.parse.urlencode({
              'q': query,
              'key': API_KEY,
              'fields': 'files(id,name,mimeType)',
              'orderBy': 'name',
              'pageSize': 200,
          })

          url = f"https://www.googleapis.com/drive/v3/files?{params}"
          with urllib.request.urlopen(url) as r:
              data = json.loads(r.read())

          products = [
              {"id": f["id"], "name": f["name"]}
              for f in data.get("files", [])
              if f.get("mimeType", "").startswith("image/")
          ]

          with open("products.json", "w", encoding="utf-8") as fp:
              json.dump(products, fp, indent=2, ensure_ascii=False)

          print(f"{len(products)} produto(s) encontrado(s).")
          EOF

      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet && echo "Sem mudanças." || (git commit -m "Atualiza produtos automaticamente" && git push)
