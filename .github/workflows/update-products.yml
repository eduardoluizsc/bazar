name: Atualizar Produtos

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar produtos e imagens do Google Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse, pathlib, sys

          API_KEY   = os.environ.get('GOOGLE_API_KEY', '')
          FOLDER_ID = '1PysZOkqsBUF3V2jvCOO-_9gXEIEhEpxV'
          IMG_DIR   = pathlib.Path('images')
          IMG_DIR.mkdir(exist_ok=True)

          if not API_KEY:
              print("ERRO: GOOGLE_API_KEY não configurada.")
              sys.exit(1)

          def drive_list(parent_id, mime_filter=None):
              q = f"'{parent_id}' in parents and trashed = false"
              if mime_filter:
                  q += f" and mimeType = '{mime_filter}'"
              params = urllib.parse.urlencode({
                  'q': q, 'key': API_KEY,
                  'fields': 'files(id,name,mimeType)',
                  'orderBy': 'name', 'pageSize': '200',
              })
              try:
                  with urllib.request.urlopen(f"https://www.googleapis.com/drive/v3/files?{params}") as r:
                      data = json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"ERRO HTTP {e.code}: {e.read().decode()}")
                  sys.exit(1)
              if 'error' in data:
                  print(f"ERRO API: {data['error']}")
                  sys.exit(1)
              return data.get('files', [])

          def download(file_id, dest):
              if dest.exists():
                  print(f"  OK (já existe): {dest.name}")
                  return
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}?alt=media&key={API_KEY}"
              print(f"  Baixando: {dest.name}")
              try:
                  urllib.request.urlretrieve(url, dest)
              except urllib.error.HTTPError as e:
                  print(f"  ERRO ao baixar {dest.name}: HTTP {e.code}\n  {e.read().decode()}")
                  sys.exit(1)

          products = []

          # Subpastas = categorias
          subfolders = drive_list(FOLDER_ID, mime_filter='application/vnd.google-apps.folder')
          print(f"{len(subfolders)} categoria(s) encontrada(s).")

          for folder in subfolders:
              category = folder['name']
              print(f"\n[{category}]")
              images = [f for f in drive_list(folder['id']) if f['mimeType'].startswith('image/')]
              for f in images:
                  download(f['id'], IMG_DIR / f['name'])
                  products.append({'name': f['name'], 'category': category})

          # Arquivos soltos na raiz = categoria "Geral"
          root_images = [f for f in drive_list(FOLDER_ID) if f['mimeType'].startswith('image/')]
          if root_images:
              print(f"\n[Geral]")
          for f in root_images:
              download(f['id'], IMG_DIR / f['name'])
              products.append({'name': f['name'], 'category': 'Geral'})

          with open('products.json', 'w', encoding='utf-8') as fp:
              json.dump(products, fp, indent=2, ensure_ascii=False)

          print(f"\nFinalizado: {len(products)} produto(s).")
          EOF

      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json images/
          git diff --staged --quiet && echo "Sem mudanças." || (git commit -m "Atualiza produtos e imagens automaticamente" && git push)
